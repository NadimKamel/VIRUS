    <style>

        /* =========================================
           PARTNERS PAGE
        ========================================= */

        .partner-intro {
            text-align: center;
            max-width: 700px;
            margin: -20px auto 50px;
            color: var(--muted);
        }

        .partner-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }

        .partner {
            height: 170px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            border: 1px solid var(--whiteLine);
            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.045),
                    rgba(255,255,255,.015)
                );

            position: relative;
            overflow: hidden;

            transition:
                transform .3s ease,
                border-color .3s ease,
                box-shadow .3s ease;
        }

        /* Green glow */

        .partner::before {
            content: "";

            position: absolute;

            width: 120px;
            height: 120px;

            border-radius: 50%;

            background: rgba(112,225,96,.09);

            filter: blur(25px);

            opacity: 0;

            transition: opacity .3s ease;
        }

        /* Logo */

        .partner img {
            position: relative;
            z-index: 2;

            width: 100%;
            height: 100%;

            max-width: 190px;
            max-height: 95px;

            object-fit: contain;

            opacity: .72;

            filter: grayscale(100%);

            transition:
                transform .35s ease,
                opacity .35s ease,
                filter .35s ease;
        }

        /* Hover */

        .partner:hover {
            transform: translateY(-7px);

            border-color: var(--green);

            box-shadow:
                0 18px 45px rgba(112,225,96,.08);
        }

        .partner:hover::before {
            opacity: 1;
        }

        .partner:hover img {
            opacity: 1;

            filter: grayscale(0%);

            transform: scale(1.07);
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 1000px) {

            .partner-grid {
                grid-template-columns: repeat(3, 1fr);
            }

        }


        @media (max-width: 750px) {

            .partner-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .partner {
                height: 150px;
                padding: 25px;
            }

        }


        @media (max-width: 480px) {

            .partner-grid {
                grid-template-columns: 1fr;
            }

            .partner {
                height: 155px;
            }

        }

    </style>

</head>
